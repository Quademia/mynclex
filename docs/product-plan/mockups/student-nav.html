<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyNclex — Student Navigation Mockup</title>
<style>
  :root {
    --primary: #1e3a5f;
    --accent: #2d7d72;
    --bg: #f8fafc;
    --white: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --text-muted: #6b7280;
    --info-bg: #eef4fa;
    --info-accent: #2d6fc0;
    --info-text: #0c447c;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--primary);
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .controls-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: 4px;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text);
  }
  button:hover { border-color: var(--border-strong); }

  button.primary {
    background: var(--info-bg);
    color: var(--info-text);
    border-color: var(--info-accent);
  }

  .stage {
    background: var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
  }

  .frame {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    min-height: 460px;
    position: relative;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    color: inherit;
  }

  .brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--primary);
  }

  .brand-name {
    font-weight: 600;
    font-size: 14px;
  }

  .brand-product {
    font-size: 12px;
    color: var(--text-muted);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .switcher {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 3px;
    border-radius: var(--radius-sm);
  }

  .switcher button {
    padding: 4px 12px;
    font-size: 11px;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: var(--text-muted);
  }

  .switcher button.active {
    background: var(--white);
    color: var(--primary);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--info-bg);
    color: var(--info-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
  }

  .body {
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: 400px;
  }

  .sidebar {
    background: var(--bg);
    border-right: 1px solid var(--border);
    padding: 12px 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    border-left: 3px solid transparent;
    color: var(--text-muted);
  }

  .nav-item:hover { background: rgba(0,0,0,0.02); }

  .nav-item.active {
    background: var(--white);
    border-left-color: var(--accent);
    color: var(--primary);
    font-weight: 600;
  }

  .nav-item svg { flex-shrink: 0; }

  .page {
    padding: 20px;
  }

  .page-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--primary);
  }

  .page-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .page-body {
    padding: 14px;
    background: var(--bg);
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .picker {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 420px;
    padding: 40px 20px;
  }

  .picker-inner {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .picker-greeting {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--primary);
  }

  .picker-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 640px) {
    .picker-grid { grid-template-columns: 1fr; }
    .body { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  }

  .picker-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 16px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s, transform 0.1s;
  }

  .picker-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .picker-card.empty {
    border-style: dashed;
    border-color: var(--border-strong);
  }

  .picker-card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .picker-card-title {
    font-weight: 600;
    font-size: 14px;
  }

  .picker-card.empty .picker-card-title {
    color: var(--text-muted);
  }

  .picker-card-sub {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .modal {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 380px;
    width: 100%;
    border: 1px solid var(--border);
  }

  .modal-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .modal-title {
    font-weight: 600;
    font-size: 15px;
  }

  .modal-body {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 18px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>MyNclex — Student Navigation</h1>
  <p class="subtitle">Interactive mockup. Toggle student type, navigate the sidebars, click the Programme pill on a bank-only student to see the upsell modal.</p>

  <div class="controls">
    <span class="controls-label">Student type:</span>
    <button id="btn-bankonly">Bank-only</button>
    <button id="btn-programme">Programme + Bank</button>
  </div>

  <div class="stage">
    <div id="frame" class="frame"></div>
  </div>

  <div id="hint" class="hint"></div>
</div>

<script>
(function(){

  // ── Icons ─────────────────────────────────────────────
  const icons = {
    home:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
    book:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    target:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
    map:     '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>',
    clock:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    user:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    calendar:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    video:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',
    check:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    plus:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    lock:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
  };

  // ── Nav definitions ───────────────────────────────────
  const bankNav = [
    { key: 'dashboard', label: 'Dashboard',       icon: 'home' },
    { key: 'bank',      label: 'Question Bank',   icon: 'book' },
    { key: 'packs',     label: 'Readiness Packs', icon: 'target' },
    { key: 'journey',   label: 'Journey Tracker', icon: 'map' },
    { key: 'history',   label: 'History',         icon: 'clock' },
    { key: 'profile',   label: 'Profile',         icon: 'user' }
  ];

  const progNav = [
    { key: 'overview',  label: 'Programme Home',  icon: 'home' },
    { key: 'weeks',     label: 'Weeks',           icon: 'calendar' },
    { key: 'sessions',  label: 'Live Sessions',   icon: 'video' },
    { key: 'tasks',     label: 'My Tasks',        icon: 'check' },
    { key: 'profile',   label: 'Profile',         icon: 'user' }
  ];

  // ── Page content stubs ────────────────────────────────
  const pages = {
    dashboard: ['Dashboard',                     'Your bank subscription overview',      'Bank 90-day · 42 days left. Recent practice sessions, readiness score, quick links.'],
    bank:      ['Question Bank',                 'Practice NCLEX-RN questions',          'Filters by topic, cognitive level, and NGN type. Start a new set or resume.'],
    packs:     ['Readiness Packs',               'Curated assessment sets',              'Timed packs with reserved questions. Good for end-of-week checkpoints.'],
    journey:   ['Journey Tracker',               '7-phase migration prep',               'Credential evaluation → English → state board → ATT → exam booking.'],
    history:   ['History',                       'Past attempts and scores',             'All completed practice sessions, mocks, and readiness packs.'],
    profile:   ['Profile',                       'Account and settings',                 'Email, password, preferences, subscription details.'],
    overview:  ['Dr Mensah — 8-Week Bootcamp',   'Week 3 of 8 · 34% complete',           'Announcements, next live session, tutor contact, programme progress bar.'],
    weeks:     ['Weeks',                         'Week-by-week curriculum',              'Reading, videos, practice quizzes, mocks grouped by week.'],
    sessions:  ['Live Sessions',                 'Upcoming and recorded',                'Sat 10:00 GMT · join link · past session recordings.'],
    tasks:     ['My Tasks',                      'Pending activities',                   'Unfinished readings, unattempted mocks, overdue items.']
  };

  // ── State ─────────────────────────────────────────────
  let studentType = 'bankonly';   // 'bankonly' | 'programme'
  let screen = 'picker';          // 'picker' | 'bank' | 'prog'
  let activeKey = 'dashboard';
  let showModal = false;

  // ── Rendering helpers ─────────────────────────────────
  function topbar(productLabel, showSwitch) {
    let switcherHtml = '';
    if (showSwitch) {
      switcherHtml = `
        <div class="switcher">
          <button data-switch="bank" class="${screen === 'bank' ? 'active' : ''}">Bank</button>
          <button data-switch="prog" class="${screen === 'prog' ? 'active' : ''}">Programme</button>
        </div>
      `;
    }
    return `
      <div class="topbar">
        <div class="brand">
          <button data-home="1" class="brand-btn">
            <div class="brand-logo"></div>
            <span class="brand-name">QAcademy</span>
          </button>
          <span class="brand-product">· ${productLabel}</span>
        </div>
        <div class="topbar-right">
          ${switcherHtml}
          <div class="avatar">SA</div>
        </div>
      </div>
    `;
  }

  function sidebar(nav) {
    let html = '<div class="sidebar">';
    nav.forEach(item => {
      const isActive = item.key === activeKey;
      html += `
        <div class="nav-item ${isActive ? 'active' : ''}" data-navkey="${item.key}">
          ${icons[item.icon]}
          <span>${item.label}</span>
        </div>
      `;
    });
    html += '</div>';
    return html;
  }

  function pageContent(key) {
    const [title, sub, body] = pages[key];
    return `
      <div class="page">
        <div class="page-title">${title}</div>
        <div class="page-sub">${sub}</div>
        <div class="page-body">${body}</div>
      </div>
    `;
  }

  function picker() {
    const progCard = studentType === 'programme'
      ? `<button data-go="prog" class="picker-card">
           <div class="picker-card-head" style="color: var(--info-accent);">${icons.calendar}<span class="picker-card-title" style="color: var(--text);">My Programme</span></div>
           <div class="picker-card-sub">Dr Mensah — 8-Week Bootcamp · Week 3 of 8</div>
         </button>`
      : `<button data-browse="1" class="picker-card empty">
           <div class="picker-card-head" style="color: var(--text-muted);">${icons.plus}<span class="picker-card-title">No programme yet</span></div>
           <div class="picker-card-sub">Browse tutor programmes →</div>
         </button>`;

    const bankCard = `
      <button data-go="bank" class="picker-card">
        <div class="picker-card-head" style="color: var(--accent);">${icons.book}<span class="picker-card-title" style="color: var(--text);">Question Bank</span></div>
        <div class="picker-card-sub">Self-study practice · 42 days left</div>
      </button>
    `;

    return `
      <div class="picker">
        <div class="picker-inner">
          <div class="picker-greeting">Welcome back, Sam</div>
          <div class="picker-sub">Where would you like to go?</div>
          <div class="picker-grid">${progCard}${bankCard}</div>
        </div>
      </div>
    `;
  }

  function modal() {
    return `
      <div class="modal-overlay">
        <div class="modal">
          <div class="modal-head" style="color: var(--text-muted);">
            ${icons.lock}
            <span class="modal-title" style="color: var(--text);">No programme yet</span>
          </div>
          <div class="modal-body">Tutor programmes add week-by-week structure and live sessions on top of your bank access. Browse available programmes to enrol.</div>
          <div class="modal-actions">
            <button data-modal-close="1">Not now</button>
            <button data-browse="1" class="primary">Browse programmes</button>
          </div>
        </div>
      </div>
    `;
  }

  function render() {
    const frame = document.getElementById('frame');
    const hint  = document.getElementById('hint');
    const bankKeys = { dashboard:1, bank:1, packs:1, journey:1, history:1, profile:1 };
    const progKeys = { overview:1, weeks:1, sessions:1, tasks:1, profile:1 };

    if (screen === 'picker') {
      frame.innerHTML = topbar('MyNclex', false) + picker();
      hint.textContent = studentType === 'programme'
        ? 'Picker: both cards active. No switcher at this level — picker is the switcher.'
        : 'Picker: Bank card active; Programme card is a "No programme yet" stub leading to browse.';
    } else if (screen === 'bank') {
      if (!(activeKey in bankKeys)) activeKey = 'dashboard';
      frame.innerHTML = topbar('Bank', true) +
        `<div class="body">${sidebar(bankNav)}${pageContent(activeKey)}</div>`;
      hint.textContent = studentType === 'programme'
        ? 'Inside Bank. Clicking the Programme switcher navigates freely (they own both).'
        : 'Inside Bank. Clicking the Programme switcher pops an upsell modal (marketing nudge).';
    } else {
      if (!(activeKey in progKeys)) activeKey = 'overview';
      frame.innerHTML = topbar('Programme', true) +
        `<div class="body">${sidebar(progNav)}${pageContent(activeKey)}</div>`;
      hint.textContent = 'Inside Programme. Switcher flips to Bank. Clicking the QAcademy logo returns to the picker.';
    }

    if (showModal) frame.insertAdjacentHTML('beforeend', modal());

    // ── Event wiring ────────────────────────────────
    frame.querySelectorAll('[data-navkey]').forEach(el => {
      el.addEventListener('click', () => { activeKey = el.dataset.navkey; render(); });
    });
    frame.querySelectorAll('[data-switch]').forEach(el => {
      el.addEventListener('click', () => {
        const target = el.dataset.switch;
        if (target === 'prog' && studentType === 'bankonly') { showModal = true; render(); return; }
        screen = target;
        activeKey = screen === 'bank' ? 'dashboard' : 'overview';
        showModal = false;
        render();
      });
    });
    frame.querySelectorAll('[data-go]').forEach(el => {
      el.addEventListener('click', () => {
        const target = el.dataset.go;
        if (target === 'prog' && studentType === 'bankonly') { showModal = true; render(); return; }
        screen = target;
        activeKey = screen === 'bank' ? 'dashboard' : 'overview';
        render();
      });
    });
    frame.querySelectorAll('[data-home]').forEach(el => {
      el.addEventListener('click', () => { screen = 'picker'; showModal = false; render(); });
    });
    frame.querySelectorAll('[data-browse]').forEach(el => {
      el.addEventListener('click', () => {
        showModal = false;
        document.getElementById('hint').textContent = '(Would navigate to the public /programmes listing page — not wired in this mockup.)';
      });
    });
    frame.querySelectorAll('[data-modal-close]').forEach(el => {
      el.addEventListener('click', () => { showModal = false; render(); });
    });
  }

  // ── Top-level controls ────────────────────────────────
  document.getElementById('btn-bankonly').addEventListener('click', () => {
    studentType = 'bankonly';
    screen = 'picker';
    showModal = false;
    render();
  });
  document.getElementById('btn-programme').addEventListener('click', () => {
    studentType = 'programme';
    screen = 'picker';
    showModal = false;
    render();
  });

  render();
})();
</script>

</body>
</html>
