name: Deploy dev Worker (personal CF)

on:
  push:
    branches:
      - main

# One deploy at a time. If a second push lands while one is in flight,
# the new one waits rather than racing.
concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mynclex-dev to personal CF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm clean-install

      # ⚠ THESE MUST BE HERE, NOT ONLY IN wrangler.jsonc, AND THE REASON IS
      # THE ONE THING TO UNDERSTAND ABOUT THIS FILE.
      #
      # wrangler.jsonc's `vars` are RUNTIME bindings — Cloudflare hands
      # them to the Worker when it serves a request, which is why the
      # SERVER half of the app has always worked. But `NEXT_PUBLIC_*` is a
      # BUILD-time substitution: webpack replaces each reference with a
      # string literal while `next build` runs, and anything absent then
      # becomes `undefined` in the browser bundle FOREVER. A runtime
      # binding arrives hours too late to help.
      #
      # ⭐ Found 2026-08-08, and it had been silently true for as long as
      # these workflows have existed. The symptom that exposed it was the
      # Turnstile widget rendering server-side and then vanishing on
      # hydration — but it was never only Turnstile: the deployed
      # `/reset-password` bundle read
      # `createBrowserClient(n.env.NEXT_PUBLIC_SUPABASE_URL, …)` with the
      # references UNREPLACED, so that page and `/welcome` could not have
      # worked on either Worker. Both were verified on localhost, where
      # `.env.local` is present at build time — which is exactly why three
      # months of sessions never caught it.
      #
      # ⚠ DUPLICATED WITH wrangler.jsonc ON PURPOSE, and that is known
      # debt: two places, one truth, no mechanism keeping them in step
      # (wrangler.jsonc is JSONC, so a workflow step cannot simply `jq` it
      # out). If you change a public value in one, change it in the other.
      # All three are public by design — they ship to every browser and
      # RLS is what protects the data.
      - name: Build OpenNext bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://xkqxfzfsllxyxpdtcrja.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrcXhmemZzbGx4eXhwZHRjcmphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMjk4ODYsImV4cCI6MjA5MjgwNTg4Nn0.yRC-HClidhjdUELZETOo9ndyKzzkV7k6Dn_QlyCjx9E
          # ⭐⭐ DEV IS DELIBERATELY ON CLOUDFLARE'S *TESTING* PAIR. Not a
          # placeholder, not a leaked key, not something to "fix" back to
          # the real one — read the long note at the matching line in
          # wrangler.jsonc before changing this.
          #
          # Short version: 1x00000000000000000000AA is published by
          # Cloudflare and renders a normal visible widget that passes
          # instantly with no challenge, so an automated browser can reach
          # /login, /register and /forgot-password. A real widget's whole
          # purpose is to prevent that, and it succeeds. Settled 2026-08-09.
          #
          # ⚠ Must match wrangler.jsonc AND the secret on the dev Supabase
          # project's captcha setting. A testing pass checked against the
          # real secret is refused — a mismatch takes dev's front door down.
          #
          # The real dev widget, for when we swap back:
          # 0x4AAAAAAEKb3Z55nyB9Sipe (personal CF account; its hostname list
          # must carry mynclex-dev.mybackpacc.workers.dev, or the widget
          # throws 110200 and issues no pass).
          #
          # ⚠ If you copy this workflow to create a new environment, this
          # line is the one to change first.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Deploy to personal CF
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          command: deploy
